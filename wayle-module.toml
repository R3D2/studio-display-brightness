# display-brightness — wayle custom module
#
# The bar shows the brightness of the screen you are looking at:
#   DP-1 focused -> "100%"  class "bright"
#   DP-4 focused -> "60%"   class "mid"
#
# On this machine the wayle config is generated by home-manager, so this block
# belongs in services.wayle.settings in /etc/nixos/home.nix rather than being
# pasted into ~/.config/wayle/config.toml (which is a read-only store symlink).
# See home-nix.patch next to this file for the Nix version.

[[modules.custom]]
id = "display-brightness"
command = "display-brightness watch"
mode = "watch"                   # one JSON line per change, no polling
restart-policy = "on-exit"
format = "{{ text }}"
tooltip-format = "{{ tooltip }}"
class-format = "{{ class }}"     # dim | mid | bright, for styling

# A custom module is not told which bar it is on, so it follows the focused
# screen instead. Under focus-follows-mouse the screen you are pointing at is
# the focused one, so scrolling on a bar changes the display that bar is on.
scroll-up = "display-brightness up"
scroll-down = "display-brightness down"
left-click = "display-brightness cycle"
right-click = "display-brightness set 100"

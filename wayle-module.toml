# studio-display-brightness — wayle custom module
#
# The bar shows the brightness of the screen you are looking at:
#   DP-1 focused -> "100%"  class "bright"
#   DP-4 focused -> "60%"   class "mid"
#
# If home-manager generates your wayle config, ~/.config/wayle/config.toml is a
# read-only store symlink and this block belongs in services.wayle.settings
# instead -- or use the home-manager module in this flake, which defines it for
# you. See the README.

[[modules.custom]]
id = "studio-display-brightness"
command = "studio-display-brightness watch"
mode = "watch"                   # one JSON line per change, no polling
restart-policy = "on-exit"
format = "{{ text }}"
tooltip-format = "{{ tooltip }}"
class-format = "{{ class }}"     # dim | mid | bright, for styling

# A custom module is not told which bar it is on, so it follows the focused
# screen instead. Under focus-follows-mouse the screen you are pointing at is
# the focused one, so scrolling on a bar changes the display that bar is on.
scroll-up = "studio-display-brightness up"
scroll-down = "studio-display-brightness down"
left-click = "studio-display-brightness cycle"
right-click = "studio-display-brightness set 100"
